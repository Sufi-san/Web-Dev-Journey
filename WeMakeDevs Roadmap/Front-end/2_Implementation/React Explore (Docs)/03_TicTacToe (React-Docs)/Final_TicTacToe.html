<html>
<head>
    <title>Final Tic-Tac-Toe</title>
</head>
<body>
  <div id="root"></div>
</body>
<!-- This setup is not suitable for production. -->
<!-- Only use it in development! -->
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script async src="https://ga.jspm.io/npm:es-module-shims@1.7.0/dist/es-module-shims.js"></script>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react?dev",
    "react-dom/client": "https://esm.sh/react-dom/client?dev"
  }
}
</script>
<script type="text/babel" data-type="module">
import React, { StrictMode } from 'react';
import { createRoot } from 'react-dom/client';

import { useState } from 'react';

function Square({ value, onSquareClick, winningSquare }) {
  const squareStyleObj = (winningSquare)?
    {backgroundColor: "blue", color: "white"}:
    {};
  return (
    <button className="square" onClick={onSquareClick} style={squareStyleObj}>
      {value}
    </button>
  );
}

function Board({ xIsNext, squares, onPlay, currentMove }) {
  function handleClick(i) {
    if (calculateWinner(squares) || squares[i]) {
      return;
    }
    const nextSquares = squares.slice();
    if (xIsNext) {
      nextSquares[i] = 'X';
    } else {
      nextSquares[i] = 'O';
    }
    
    const newMoveCoord = `(${parseInt(i / 3)}, ${i % 3})`;

    onPlay(nextSquares, newMoveCoord);
  }

  function checkSquare(winningLine, index) {
    for(const num of winningLine) if(num == index) return true;
    return false;
  }

  let winningLine = [];
  const winner = calculateWinner(squares); 
  let status;
  if (winner) {
    status = 'Winner: ' + winner;
   winningLine = getWinningLine(squares);
  } else {
    status = (currentMove == 9)? "Game Drawn" :'Next player: ' + (xIsNext ? 'X' : 'O');
  }

  return (
    <>
      <div className="status">{status}</div>
      {squares.reduce((acc, curr, index) => {
        // inside first loop
        const lastRow = acc[acc.length - 1]
        lastRow.push(curr);
      
        if(index % 3 == 2) {
          acc[acc.length - 1] = ( 
            <div key={index/3} className="board-row">
              {lastRow.map((value, valIndex) => {
              // inside second loop
                const squareIndex = valIndex + 3 * Math.floor(index / 3);
                return (
                  <Square
                    key={valIndex}
                    value={value}
                    onSquareClick={() => handleClick(squareIndex)} 
                    winningSquare={checkSquare(winningLine, squareIndex)}
                  />
                )
              })}
            </div>
          );
          
          if(index < squares.length - 1) acc.push([]);
        }
      
        return acc;
      }, [[]])}
    </>
  );
}

let App = function Game() { 
  const [history, setHistory] = useState([Array(9).fill(null)]);
  const [moveCoords, setMoveCoords] = useState([""]);
  const [currentMove, setCurrentMove] = useState(0);
  const xIsNext = currentMove % 2 === 0;
  const currentSquares = history[currentMove];
  const [movesReversed, setMovesReversed] = useState(false); 
  
  function handlePlay(nextSquares, newMoveCoord) {
    const nextHistory = [...history.slice(0, currentMove + 1), nextSquares];
    const nextMoveCoords = [...moveCoords.slice(0, currentMove + 1), newMoveCoord];
    setHistory(nextHistory);
    setMoveCoords(nextMoveCoords);
    setCurrentMove(nextHistory.length - 1);
  }

  function jumpTo(nextMove) {
    setCurrentMove(nextMove);
  }

  const movesList = history.map((squares, move) => {
    let description;
    if (move > 0) {
      description = 'Go to move #' + move + " " + moveCoords[move];
    } else {
      description = 'Go to game start';
    } 
    
    return (
      <li key={move}>
        {
          currentMove == move?
          <span style={{fontSize: "14px"}}>You are at move #{move} {moveCoords[move]}</span>:
          <button onClick={() => jumpTo(move)}>{description}</button>
        }
      </li>
    );
  });

  return (
    <div className="game">
      <div className="game-board">
        <Board 
          xIsNext={xIsNext} 
          squares={currentSquares} 
          onPlay={handlePlay}
          currentMove={currentMove} />
      </div>
      <div className="game-info">
        <button onClick={() => setMovesReversed(!movesReversed)}>Change Order</button>
        <ol>{!movesReversed? movesList: movesList.reverse()}</ol>
      </div>
    </div>
  )
}

function calculateWinner(squares) {
  const winningLine = getWinningLine(squares);
  if(winningLine) return squares[winningLine[0]];
  return null;
}

function getWinningLine(squares) {
  const lines = [
    [0, 1, 2],
    [3, 4, 5],
    [6, 7, 8],
    [0, 3, 6],
    [1, 4, 7],
    [2, 5, 8],
    [0, 4, 8],
    [2, 4, 6],
  ];
  for (let i = 0; i < lines.length; i++) {
    const [a, b, c] = lines[i];
    if (squares[a] && squares[a] === squares[b] && squares[a] === squares[c]) {
      return lines[i];
    }
  } 
  return null;
}

const root = createRoot(document.getElementById('root'));
root.render(
  <StrictMode>
    <App />
  </StrictMode>
);
</script>
